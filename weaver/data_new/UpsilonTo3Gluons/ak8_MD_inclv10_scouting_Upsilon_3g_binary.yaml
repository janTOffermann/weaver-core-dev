    - scoutfj_gen_phi
    - scoutfj_gen_mass
    - scoutfj_gen_pid
    - scoutfj_genjet_mass 
    - scoutfj_gen_deltaR
    - scoutfj_gendau1_pt
    - scoutfj_gendau1_eta
    - scoutfj_gendau1_phi
    - scoutfj_gendau1_mass
    - scoutfj_gendau1_pid
    - scoutfj_gendau1_deltaR
    - scoutfj_gendau2_pt
    - scoutfj_gendau2_eta
    - scoutfj_gendau2_phi
    - scoutfj_gendau2_mass
    - scoutfj_gendau2_pid
    - scoutfj_gendau2_deltaR
    - scoutfj_gendau3_pt
