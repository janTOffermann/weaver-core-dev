### use `&`, `|`, `~` for logical operations on numpy arrays
### can use functions from `math`, `np` (numpy), and `ak` in the expression

# to select scouting jets, ensure that QCD scouting jets from the resonant (signal) samples are not included (they are not excluded in the samples; only reco QCD jets are excluded)
selection: >-
    (scoutfj_pt>40) & (scoutfj_pt<300) & (scoutfj_sdmass>0) & (scoutfj_sdmass<60) & (ak.num(scoutpfcand_px) > 0) &
    (
      ((sample_isQCD==1) & (scoutfj_label >= 2) & (scoutfj_label <= 7) & (event_no%10 <= 1)) |
      ((sample_isQCD==0) & (scoutfj_isQCD==0) & (scoutfj_gen_mass >= 5) & (scoutfj_gen_mass <= 20) & (event_no%10 <= 7)))

# & (np.sqrt(np.power(scoutfj_gen_mass, 2) + np.power(scoutfj_gen_pt, 2))/scoutfj_energy > 0.8))

### selection to apply at test time (i.e., when running w/ --predict)
test_time_selection: >- 
    (scoutfj_pt>25) & (scoutfj_pt<400) & 
    (
      ((sample_isQCD==1) & (event_no%10 > 8)) |
      ((sample_isQCD==0) & (scoutfj_isQCD==0) & (event_no%10 > 7))
    )

treename: 
  Events

new_variables:
    ### [format] name: formula
    ### can use functions from `math`, `np` (numpy), and `ak` in the expression
    # classes for reweighting
    label_Upsilon3g: (scoutfj_label == 0)
    label_UpsilonTauHTauH: (scoutfj_label == 1) | (scoutfj_label == 14)
    label_QCD: (scoutfj_label >= 2) & (scoutfj_label <= 6)

    # define "v3 for scouting" labels
    # in the order of actually label for training
    #  - 0:      Upsilon->3g, fj_label=0 
    #  - 1-4:    QCD, fj_label=2-6 
    fj_label_scout: >-
        ak.where((scoutfj_label == 0) & ((scoutfj_gen_pid == 553) | (scoutfj_gen_pid == 100553) | (scoutfj_gen_pid == 200553)), 0,
        ak.where(((scoutfj_label == 1) | (scoutfj_label == 14)) & ((scoutfj_gen_pid == 553) | (scoutfj_gen_pid == 100553) | (scoutfj_gen_pid == 200553)), 1,
        ak.where((scoutfj_label >= 2) & (scoutfj_label <= 6), 2, 10000)))

    reweight_mass: np.where(sample_isQCD, scoutfj_genjet_mass, scoutfj_gen_mass)
    mass_target: np.where(sample_isQCD, scoutfj_genjet_mass, scoutfj_gen_mass) / np.maximum(scoutfj_mass, 1e-6)
    log_mass_ratio: >-
        np.where(scoutfj_isQCD,
            np.log(np.maximum(scoutfj_genjet_mass, 1e-3) / 
                   np.maximum(scoutfj_mass, 1e-3)),
            np.log(np.maximum(scoutfj_gen_mass, 1e-3) / 
                   np.maximum(scoutfj_mass, 1e-3))
        )
    

    # charged and neutral scoutingpfcand
    is_charged: scoutpfcand_charge != 0
    cscoutpfcand_pt_log: scoutpfcand_pt_log[is_charged]
    cscoutpfcand_e_log: scoutpfcand_e_log[is_charged]
    cscoutpfcand_etarel: scoutpfcand_etarel[is_charged]
    cscoutpfcand_phirel: scoutpfcand_phirel[is_charged]
    cscoutpfcand_abseta: scoutpfcand_abseta[is_charged]
    cscoutpfcand_charge: scoutpfcand_charge[is_charged]
    cscoutpfcand_isEl: scoutpfcand_isEl[is_charged]
    cscoutpfcand_isMu: scoutpfcand_isMu[is_charged]
    cscoutpfcand_isChargedHad: scoutpfcand_isChargedHad[is_charged]
    cscoutpfcand_lostInnerHits: scoutpfcand_lostInnerHits[is_charged]
    cscoutpfcand_normchi2: scoutpfcand_normchi2[is_charged]
    cscoutpfcand_quality: scoutpfcand_quality[is_charged]
    cscoutpfcand_dz: scoutpfcand_dz[is_charged]
    cscoutpfcand_dzsig: scoutpfcand_dzsig[is_charged]
    cscoutpfcand_dxy: scoutpfcand_dxy[is_charged]
    cscoutpfcand_dxysig: scoutpfcand_dxysig[is_charged]
    cscoutpfcand_btagEtaRel: scoutpfcand_btagEtaRel[is_charged]
    cscoutpfcand_btagPtRatio: scoutpfcand_btagPtRatio[is_charged]
    cscoutpfcand_btagPParRatio: scoutpfcand_btagPParRatio[is_charged]
    cscoutpfcand_px: scoutpfcand_px[is_charged]
    cscoutpfcand_py: scoutpfcand_py[is_charged]
    cscoutpfcand_pz: scoutpfcand_pz[is_charged]
    cscoutpfcand_energy: scoutpfcand_energy[is_charged]

    nscoutpfcand_pt_log: scoutpfcand_pt_log[~is_charged]
    nscoutpfcand_e_log: scoutpfcand_e_log[~is_charged]
    nscoutpfcand_etarel: scoutpfcand_etarel[~is_charged]
    nscoutpfcand_phirel: scoutpfcand_phirel[~is_charged]
    nscoutpfcand_abseta: scoutpfcand_abseta[~is_charged]
    nscoutpfcand_isGamma: scoutpfcand_isGamma[~is_charged]
    nscoutpfcand_isNeutralHad: scoutpfcand_isNeutralHad[~is_charged]
    nscoutpfcand_px: scoutpfcand_px[~is_charged]
    nscoutpfcand_py: scoutpfcand_py[~is_charged]
    nscoutpfcand_pz: scoutpfcand_pz[~is_charged]
    nscoutpfcand_energy: scoutpfcand_energy[~is_charged]

    # masks
    cscoutpfcand_mask: ak.ones_like(cscoutpfcand_px)
    nscoutpfcand_mask: ak.ones_like(nscoutpfcand_px)

preprocess:
    ### method: [manual, auto] - whether to use manually specified parameters for variable standardization
    method: manual
    ### data_fraction: fraction of events to use when calculating the mean/scale for the standardization
    data_fraction:

inputs:
    cpf_features:
        length: 90
        pad_mode: wrap
        vars:
            ### [format 1]: var_name (no transformation)
            ### [format 2]: [var_name,
            ###              subtract_by(optional, default=None, no transf. if preprocess.method=manual, auto transf. if preprocess.method=auto),
            ###              multiply_by(optional, default=1),
            ###              clip_min(optional, default=-5),
            ###              clip_max(optional, default=5),
            ###              pad_value(optional, default=0)]
            - [cscoutpfcand_pt_log, 1, 0.5]
            - [cscoutpfcand_e_log, 1.3, 0.5]
            - cscoutpfcand_etarel
            - cscoutpfcand_phirel
            - [cscoutpfcand_abseta, 0.6, 1.6]
            - cscoutpfcand_charge
            - cscoutpfcand_isEl
            - cscoutpfcand_isMu
            - cscoutpfcand_isChargedHad
            - cscoutpfcand_lostInnerHits
            - [cscoutpfcand_normchi2, 5, 0.2]
            - [cscoutpfcand_quality, 0, 0.2]
            - [cscoutpfcand_dz, 0, 180]
            - [cscoutpfcand_dzsig, 0, 0.9]
            - [cscoutpfcand_dxy, 0.0, 300]
            - [cscoutpfcand_dxysig, 0, 1.0]
            - [cscoutpfcand_btagEtaRel, 1.5, 0.5]
            - [cscoutpfcand_btagPtRatio, 0, 1]
            - [cscoutpfcand_btagPParRatio, 0, 1]
    cpf_vectors:
        length: 90
        pad_mode: wrap
        vars:
            - [cscoutpfcand_px, null]
            - [cscoutpfcand_py, null]
            - [cscoutpfcand_pz, null]
            - [cscoutpfcand_energy, null]
    cpf_mask:
        length: 90
        pad_mode: constant
        vars:
            - cscoutpfcand_mask
    npf_features:
        length: 60
        pad_mode: wrap
        vars:
            - [nscoutpfcand_pt_log, 1, 0.5]
            - [nscoutpfcand_e_log, 1.3, 0.5]
            - nscoutpfcand_etarel
            - nscoutpfcand_phirel
            - [nscoutpfcand_abseta, 0.6, 1.6]
            - nscoutpfcand_isGamma
            - nscoutpfcand_isNeutralHad
    npf_vectors:
        length: 60
        pad_mode: wrap
        vars:
            - [nscoutpfcand_px, null]
            - [nscoutpfcand_py, null]
            - [nscoutpfcand_pz, null]
            - [nscoutpfcand_energy, null]
    npf_mask:
        length: 60
        pad_mode: constant
        vars:
            - nscoutpfcand_mask

labels:
    ### type can be `simple`, `custom`, 'hybrid'
    type: custom
    value:
      truth_label: fj_label_scout  # just input the label index
      target_res_mass_factor: np.where(scoutfj_isQCD, scoutfj_genjet_mass, scoutfj_gen_mass) / np.maximum(scoutfj_mass, 1e-6)
      # target_parts_mass_factor: np.where(scoutfj_isQCD, scoutfj_genjet_mass, scoutfj_genparts_mass) / np.maximum(scoutfj_sdmass, 1e-6)

